# https://govee.freecats.me/
name: deploy to github pages

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
            # since this is a raw js project i'm not gonna bother with the dist stuff. just deploy my src/ folder, please.
          path: 'src'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
